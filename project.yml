name: Burnrate
options:
  bundleIdPrefix: com.burnrate
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sparkle compares CFBundleVersion to decide what is newer, and
    # Sources/Info.plist reads both from here — hardcoding them there instead
    # silently pins every build to one version, so no customer ever sees an
    # update. Bump CURRENT_PROJECT_VERSION on every release.
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "5"
    # TODO(owner): set to your Apple Developer team ID once the org account
    # exists (it appears in Xcode → Settings → Accounts, and in signing
    # certificates as "(XXXXXXXXXX)" after the name). Empty is fine until
    # then: `make build`/`make test` ad-hoc sign, and `make archive` is the
    # only path that needs a real team.
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Required by notarization. Worth knowing what it does *not* break here:
    # the keychain read is unaffected (the ACL keys on the signing identity,
    # which is unchanged), and reading Cursor's and Codex's SQLite files is
    # ordinary file access. It is the App Sandbox that would break both, which
    # is why that stays off — Developer ID distribution does not require it.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Burnrate:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Burnrate
        CFBundleDisplayName: Burnrate
        # Follows the deployment target rather than a literal, so a
        # per-invocation `make test DEPLOYMENT_TARGET=15.0` on an older host
        # passes Launch Services too — a hardcoded floor here is what refused
        # to launch the test host on macOS 15 machines. The shipped floor is
        # set once by `deploymentTarget` above.
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # --- Sparkle -------------------------------------------------------
        # Disabled until the product's own update infrastructure exists.
        # The upstream project's feed and EdDSA key were removed during the
        # rebrand: shipping them would have let another party's server replace
        # this app's binaries. To re-enable: point SUFeedURL at an appcast you
        # control, paste the public half of YOUR key from
        # `xcrun sparkle-generate-keys` into SUPublicEDKey, and flip the two
        # switches below. Until then the app never checks for updates.
        SUFeedURL: https://updates.burnrate.invalid/appcast.xml
        # SUPublicEDKey: <run `xcrun sparkle-generate-keys`, paste here>
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burnrate.burnrate
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BurnrateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Burnrate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burnrate.burnrate.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Burnrate:
    build:
      targets:
        Burnrate: all
        BurnrateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BurnrateTests
