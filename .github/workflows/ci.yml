name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The supported floor is macOS 15 (project.yml deploymentTarget), so CI
    # builds and tests on both ends of the supported range: the 26 image
    # (newest SDK) and the 15 image (the oldest OS a customer may run — and
    # the one most fleet machines run).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install xcodegen
        run: brew install xcodegen

      # `make test` generates the project (gen) and runs the full suite with
      # ad-hoc signing (DEV_SIGN), so no certificates or provisioning are
      # needed here — by design, so anyone can build and CI stays secret-free.
      - name: Build and test
        run: make test

      # Unit tests cannot catch launch-lifecycle deaths: the app has no
      # on-screen windows at rest, so macOS automatic termination used to quit
      # it seconds after an `open` launch (fixed by NSSupportsAutomaticTermination
      # in project.yml). This soaks a real launch the way a user gets one.
      - name: "Smoke: launch via Launch Services and survive"
        run: |
          APP=$(xcodebuild -project Burnrate.xcodeproj -scheme Burnrate \
            -destination 'platform=macOS,arch=arm64' -configuration Debug \
            -showBuildSettings 2>/dev/null \
            | awk -F' = ' '/ BUILT_PRODUCTS_DIR/ {print $2; exit}')/Burnrate.app
          open "$APP"
          sleep 20
          pgrep -x Burnrate >/dev/null || (echo "app died within 20s of launch" && exit 1)
          echo "survived 20s"
          pkill -x Burnrate

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.runner }}
          path: |
            build/
            ~/Library/Developer/Xcode/DerivedData/Burnrate-*/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7
