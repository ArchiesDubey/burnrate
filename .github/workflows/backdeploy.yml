# Back-deploy probe — manual only (`gh workflow run backdeploy.yml`).
#
# Answers one question: does the app work when built for an older floor?
# Runs the FULL test suite on a macOS 15 host with the deployment target
# lowered to 15.0 — compile compatibility, unit tests, and (indirectly)
# 15-era framework behaviour. If this is green, lowering the shipped floor
# in project.yml is a support/QA decision, not an engineering one.

name: Back-deploy probe

on:
  workflow_dispatch:

jobs:
  probe-macos-15:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && sw_vers

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test against the macOS 15 SDK at floor 15.0
        run: make test DEPLOYMENT_TARGET=15.0
