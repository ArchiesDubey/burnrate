# Back-deploy probe — manual only (`gh workflow run backdeploy.yml`).
#
# Answers one question: does the code compile against the macOS 15 SDK with
# the deployment target lowered to 15.0? If yes, backward compatibility is a
# support/QA decision, not an engineering one. If no, the failures list the
# macOS-26-only APIs that would need @available guards.
#
# Build only — deliberately not `make test`, since unit tests exercising 26-era
# behaviour can fail on a 15 host for reasons that say nothing about compiling.

name: Back-deploy probe

on:
  workflow_dispatch:

jobs:
  probe-macos-15:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && sw_vers

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build against the macOS 15 SDK
        run: |
          set -o pipefail
          xcodebuild -project Burnrate.xcodeproj -scheme Burnrate \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" CODE_SIGN_STYLE=Automatic \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            build 2>&1 | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD" | head -60
          exit "${PIPESTATUS[0]}"
